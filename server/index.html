<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>WebRTC File Sender</title>
</head>

<body>

    <input type="text" id="roomId" placeholder="Room ID">
    <button id="connect">Connect</button>
    <br><br>

    <input type="file" id="videoFile" accept="video/*">
    <button id="start">Start Video</button>

    <h3>Local Video</h3>
    <video id="localVideo" width="320" height="240" autoplay muted playsinline></video>

    <h3>Remote Video</h3>
    <div id="remoteVideos"></div>

    <script>
        let pc
        let ws
        let roomId
        let isNegotiating = false;

        pc = new RTCPeerConnection()

        pc.ontrack = e => {
            if (e.track.kind !== "video") return
            console.log(e.track.kind)
            console.log(e)
            const el = document.createElement("video")
            el.srcObject = e.streams[0]
            el.autoplay = true
            el.playsInline = true
            document.getElementById("remoteVideos").appendChild(el)
        }

        pc.onicecandidate = e => {
            console.log("candidate")
            if (!e.candidate) return
            ws.send(JSON.stringify({
                type: "candidate",
                data: JSON.stringify(e.candidate),
                sdp: "",
                roomId: roomId
            }))
        }

        pc.onnegotiationneeded = async () => {
            try {
                // 1. Guard against concurrent negotiations (Prevents InvalidModificationError)
                if (isNegotiating || pc.signalingState !== "stable") {
                    return;
                }

                isNegotiating = true;
                console.log("Negotiation needed: Creating offer...");

                // 2. Create the offer
                const offer = await pc.createOffer();

                // 3. Double-check state before setting local description
                if (pc.signalingState !== "stable") return;

                await pc.setLocalDescription(offer);

                // 4. Send to SFU
                ws.send(JSON.stringify({
                    type: "offer",
                    data: JSON.stringify(pc.localDescription), // Use pc.localDescription for accuracy
                    roomId: roomId
                }));

            } catch (err) {
                console.error("Negotiation failed:", err);
            } finally {
                isNegotiating = false;
            }
        };

        document.getElementById("connect").onclick = () => {
            roomId = document.getElementById("roomId").value
            if (!roomId) {
                alert("Enter room ID")
                return
            }

            ws = new WebSocket("ws://localhost:8085/ws")

            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: "join",
                    data: "",
                    sdp: "",
                    roomId: roomId
                }))
            }

            ws.onmessage = onWSMessage
        }

        document.getElementById("start").onclick = async () => {
            console.log("start")
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("Connect first")
                return
            }

            const file = document.getElementById("videoFile").files[0]
            if (!file) {
                alert("Select a video file")
                return
            }

            const video = document.getElementById("localVideo")
            video.src = URL.createObjectURL(file)
            video.loop = true
            await video.play()

            const stream = video.captureStream
                ? video.captureStream()
                : video.mozCaptureStream()

            // const { codecs } = RTCRtpSender.getCapabilities('video');
            // const vp9Codecs = codecs.filter(c => c.mimeType === 'video/VP9');

            const transceiver = pc.addTransceiver(stream.getVideoTracks()[0], {
                direction: 'sendonly',
                streams: [stream],
                // sendEncodings: [
                //     {
                //         rid: 'f',
                //         scalabilityMode: "L3T3"
                //     }
                // ]
            })

            const transiever2 = pc.addTransceiver(stream.getAudioTracks()[0], {
                direction: 'sendonly',
                streams: [stream],
            })

            // transceiver.setCodecPreferences(vp9Codecs);
        }

        function onWSMessage(evt) {
            const msg = JSON.parse(evt.data)

            console.log(msg)
            if (msg.type === "offer") {
                const offer = JSON.parse(msg.data)
                pc.setRemoteDescription(offer)
                pc.createAnswer().then(answer => {
                    console.log(offer)
                    console.log(answer)

                    var arr = answer.sdp.split('\r\n');
                    arr.forEach((str, i) => {
                        if (/^a=fmtp:\d*/.test(str)) {
                            arr[i] = str + ';x-google-max-bitrate=10000;x-google-min-bitrate=0;x-google-start-bitrate=6000';
                        } else if (/^a=mid:(1|video)/.test(str)) {
                            arr[i] += '\r\nb=AS:10000';
                        }
                    });
                    answer = new RTCSessionDescription({
                        type: 'answer',
                        sdp: arr.join('\r\n'),
                    })
                    pc.setLocalDescription(answer)

                    ws.send(JSON.stringify({
                        type: "answer",
                        data: JSON.stringify(answer),
                        roomId: roomId
                    }))
                })
                return
            }

            if (msg.type === "candidate") {
                pc.addIceCandidate(JSON.parse(msg.data))
            }

            if (msg.type === "answer") {
                pc.setRemoteDescription(JSON.parse(msg.data))
            }
        }
    </script>

</body>

</html>
